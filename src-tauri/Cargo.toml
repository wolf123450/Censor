[package]
name = "censor-app"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "api-all"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.24"
imageproc = "0.23"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio-util = "0.7"
base64 = "0.21"

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
